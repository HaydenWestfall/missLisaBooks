<div class="landing-page" #landing id="test">
  <div class="hero">
    <h1 id="hero-text">
      @for (letter of heroTextChunks; track $index; let i = $index) {
        <span [class.fade]="i < characterIndex()">{{ letter }} </span>
      }
    </h1>
    <div class="button-wrapper">
      @if (showAction()) {
        <app-button
          (buttonClicked)="scrollToElement('Shop')"
          text="Shop Now"
          btn-bg="var(--secondary-color)"
          btn-border="var(--secondary-color)"
          btn-color="white"
          hoverBg="transparent"
          hoverBorder="var(--secondary-color)"
          hoverColor="white"
          animate.enter="fade-in-quick"
          animate.leave="fade-out-quick"
          >Shop Now</app-button
        >
      }
      @if (showAction()) {
        <app-button
          (buttonClicked)="scrollToElement('Contact')"
          text="Contact"
          btn-bg="var(--primary-color)"
          btn-border="white"
          btn-color="white"
          hoverBg="transparent"
          hoverBorder="#dddddd"
          hoverColor="#dddddd"
          animate.enter="fade-in-quick"
          animate.leave="fade-out-quick"
          >Contact</app-button
        >
      }
    </div>
  </div>
  <div class="graphic">
    <div id="image-wrapper" class="images">
      <img
        id="riggs"
        alt="Riggs sitting in a chair"
        src="../../../assets/img/riggs.webp"
      />
      <img
        id="maddalena"
        alt="Maddalena posing for the camera"
        src="../../../assets/img/maddalena.webp"
      />
      <img
        id="faith"
        alt="Faith sitting on a bike"
        src="../../../assets/img/faith.webp"
      />
      <img
        id="riggs-repeat"
        alt=""
        aria-hidden="true"
        src="../../../assets/img/riggs.webp"
      />
    </div>
    <div id="button-wrapper" class="learn-more-button">
      <div id="dash-border-wrapper" class="border-wrapper">
        <div id="dash-border" class="border"></div>
      </div>
      <button class="circle-button light" id="hero-contact" (click)="openLearnMore()">
        <div id="contact-btn-text">Learn more</div>
      </button>
    </div>
  </div>

  <app-kid-info [selectedKid]="kidSelected()" (closeKid)="closeLearnMore()" />
</div>
